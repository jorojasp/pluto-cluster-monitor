[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pluto-cluster-monitor"
version = "0.1.0"
description = "Multi-Pluto SDR cluster monitoring and signal quality analysis in Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Jorge Rojas" }
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
# pylibiio 1.0 binds the libiio v1 C API (libiio.so.1 / libiio1.dll); the distro
# packages, Raspbian and the Windows installer used here provide libiio 0.2x.
pluto = ["pyadi-iio>=0.0.17", "pylibiio>=0.23.1,<1.0"]
local = ["matplotlib>=3.8"]
web = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29"
]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pluto_monitor.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
