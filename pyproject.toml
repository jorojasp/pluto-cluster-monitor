[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pluto-cluster-monitor"
version = "0.1.0"
description = "Multi-Pluto SDR cluster monitoring and signal quality analysis in Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Jorge Rojas" }
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "pytest>=8.0"
]

[project.optional-dependencies]
pluto = [
  "pyadi-iio>=0.0.17"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]